<div class="hero flex flex-col items-center justify-center">
  <h1>Miam Miam</h1>
  <h2>Find your next meal</h2>
</div>

<app-categories (categoryEvent)="searchByCategory($event)"></app-categories>

<app-search (searchEvent)="search($event)"></app-search>
@if (recipes$ | async; as recipes) {
  <div class="flex gap-4 flex-wrap justify-center">
    @for (recipe of recipes; track recipe.idMeal) {
      <app-card [recipe]="recipe"></app-card>
    }
  </div>
} @else {
  <div>Loading...</div>
<!--  TODO: implement error indicator here-->
}
